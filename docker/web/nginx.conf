# The Expo web build (app/dist) as a single-page app: real files first, every other path falls back to index.html so
# deep links (/trade/883, /u/<wallet>) load. Hashed bundles cache for a week; index.html never caches.
server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  location = /index.html { add_header Cache-Control "no-store"; }
  location ~* \.(js|css|webp|png|jpg|svg|ttf|woff2|mp4|json)$ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
