name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  program-unit-tests:
    name: Program unit tests (cargo test -p clashy --lib)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chain
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # chain/rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - run: cargo test -p clashy --lib

  social-server-tests:
    name: Social server tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
