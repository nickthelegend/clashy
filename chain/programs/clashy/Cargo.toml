[package]
name = "clashy"
version = "0.1.0"
description = "Clashy: PvP trading games (knockout duels, clans, clan wars, tournaments) on MagicBlock Ephemeral Rollups"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "clashy"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", default-features = false, features = ["token", "token_2022"] }
# 0.18.0 is the last release that keeps anchor-compat (Anchor 0.32) and runs on both validator 1.x (mainnet, the
# devnet TEE) and 2.0; 0.20 needs Anchor 1.2 and drops anchor-compat.
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor-compat", "vrf", "crank", "access-control"] }
solana-sha256-hasher = "3.1"
bytemuck = { version = "1.20", features = ["derive", "min_const_generics"] }

[dev-dependencies]
base64 = "0.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
